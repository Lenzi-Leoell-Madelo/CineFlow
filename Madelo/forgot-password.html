<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineFlow - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="login-screen-bg" class="h-screen flex items-center justify-center">
    <div class="bg-cine-panel/90 p-8 rounded-2xl border border-white/10 w-full max-w-md">
        <h2 class="text-2xl font-bold text-white mb-2">Forgot Password?</h2>
        <p class="text-[#808080] mb-6">No worries, we'll send you reset instructions.</p>
        <form action="login.html">
            <input type="email" placeholder="Email Address" class="w-full bg-[#0a0a0a] border border-white/10 rounded-lg px-4 py-3 text-white mb-4">
            <button class="w-full bg-[#e50914] text-white font-bold py-3 rounded-lg">Reset Password</button>
        </form>
    </div>
</body>
</html>
