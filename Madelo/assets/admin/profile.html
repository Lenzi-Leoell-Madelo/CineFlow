<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="h-screen w-screen flex overflow-hidden bg-[#0a0a0a] text-sm">

    <aside class="w-64 bg-[#141414] border-r border-white/5 flex flex-col justify-between h-full shrink-0">
        <div>
            <div class="h-20 flex items-center px-8 border-b border-white/5">
                <i class="fa-solid fa-film text-[#e50914] text-2xl mr-3"></i>
                <h1 class="font-display font-bold text-2xl text-white tracking-tighter uppercase">CineFlow</h1>
            </div>
            <nav class="mt-8 px-4 space-y-2">
                <a href="dashboard.html" class="nav-item flex items-center gap-4 px-4 py-3 text-[#808080] hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-chart-line w-5"></i> Dashboard
                </a>
                <a href="analytics.html" class="nav-item flex items-center gap-4 px-4 py-3 text-[#808080] hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-chart-pie w-5"></i> Analytics
                </a>
                <a href="reports.html" class="nav-item flex items-center gap-4 px-4 py-3 text-[#808080] hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-file-lines w-5"></i> Reports
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-white/5 space-y-2">
            <a href="profile.html" class="flex items-center gap-4 px-4 py-2 text-[#808080] hover:text-white text-xs transition-colors">
                <i class="fa-solid fa-user-gear"></i> Profile Settings
            </a>
            <a href="../../login.html" class="flex items-center gap-4 px-4 py-2 text-[#808080] hover:text-[#e50914] text-xs transition-colors">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-20 flex items-center justify-between px-8 border-b border-white/5 bg-[#0a0a0a]/80 backdrop-blur-md">
            <div class="flex items-center bg-[#141414] px-4 py-2 rounded-lg border border-white/5 w-96">
                <i class="fa-solid fa-magnifying-glass text-[#808080] mr-3"></i>
                <input type="text" placeholder="Search settings..." class="bg-transparent border-none outline-none text-white text-xs w-full">
            </div>
        </header>
        
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="mb-8">
                <h2 class="text-3xl font-display font-bold text-white uppercase tracking-tight">Profile</h2>
                <p class="text-[#808080]">Manage your personal account information and preferences.</p>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="glass-panel p-8 rounded-2xl border border-white/5 bg-[#141414] flex flex-col items-center text-center">
                    <div class="relative mb-6">
                        <img src="../../assets/img/profile.jpg" class="w-32 h-32 rounded-full border-4 border-[#e50914] object-cover" alt="Profile Picture">
                        <div class="absolute bottom-0 right-0 bg-[#e50914] w-8 h-8 rounded-full flex items-center justify-center border-4 border-[#141414]">
                            <i class="fa-solid fa-camera text-[10px] text-white"></i>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold text-white">Direk Lenzi</h3>
                    <p class="text-[#e50914] text-xs font-bold uppercase tracking-widest mt-1">Gaffer / PA / Grip</p>
                    <p class="text-[#808080] text-xs mt-4">714Productions@gmail.com</p>
                    
                    <button class="mt-8 w-full py-2 rounded-lg bg-white/5 text-white text-xs font-medium hover:bg-white/10 transition-all">
                        Change Avatar
                    </button>
                </div>

                <div class="lg:col-span-2 glass-panel p-8 rounded-2xl border border-white/5 bg-[#141414]">
                    <h3 class="text-white font-bold uppercase tracking-widest text-xs mb-8">Personal Information</h3>
                    
                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] text-[#808080] uppercase font-bold tracking-wider">Full Name</label>
                                <input type="text" value="Direk Lenzi" readonly 
                                class="w-full bg-[#0a0a0a] border border-white/5 rounded-lg px-4 py-3 text-white outline-none focus:border-[#e50914] transition-colors">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] text-[#808080] uppercase font-bold tracking-wider">Contact Number</label>
                                <input type="text" value="+63 912 345 6789" readonly 
                                class="w-full bg-[#0a0a0a] border border-white/5 rounded-lg px-4 py-3 text-white outline-none focus:border-[#e50914] transition-colors">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] text-[#808080] uppercase font-bold tracking-wider">Email Address</label>
                            <input type="email" value="714Productions@gmail.com" readonly 
                            class="w-full bg-[#0a0a0a] border border-white/5 rounded-lg px-4 py-3 text-white outline-none focus:border-[#e50914] transition-colors">
                        </div>

                        <div class="pt-4 flex justify-end gap-4">
                            <button type="button" class="px-6 py-2 rounded-lg text-[#808080] text-xs font-medium hover:text-white transition-colors">
                                Cancel
                            </button>
                            <button type="button" class="bg-[#e50914] px-8 py-2 rounded-lg font-medium text-white hover:bg-red-700 transition-all text-xs">
                                Edit Profile
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
